<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | AguTech Labs</title>
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) { }
  </script>
  <meta name="robots" content="noindex">
</head>

<body>
  <header class="header scrolled">
    <div class="container nav">
      <a href="/" class="logo" aria-label="AguTech Labs, home">
        <span class="logo-mark">AT</span>
        <span class="logo-text">AguTech <span>Labs</span></span>
      </a>
      <a href="/" class="btn btn-ghost btn-sm">← Back to home</a>
    </div>
  </header>

  <main class="not-found">
    <div class="container">
      <p class="code gradient-text">404</p>
      <h1>Page not found</h1>
      <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
      <div class="cta-group">
        <a href="/" class="btn btn-primary">Go to homepage</a>
        <a href="/#contact" class="btn btn-ghost">Contact us</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>&copy; 2026 AguTech Labs. All rights reserved.</p>
      <div class="footer-links">
        <a href="/privacy.html">Privacy</a>
        <a href="/#contact">Contact</a>
      </div>
    </div>
  </footer>
</body>

</html>
